<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rajkumar's Projects</title>
  <meta name="description" content="Rajkumar's hobby projects">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb; --card: #ffffff; --card2: #eef1f8; --text: #1b1f2a; --muted: #6b7386; --line: #dfe3ee;
      --accent: #1a73e8; --accent2: #7c4dff;
      --grad: linear-gradient(135deg, var(--accent), var(--accent2));
      --shadow: 0 6px 24px rgba(30, 40, 90, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1220; --card: #181c2f; --card2: #20253b; --text: #eceffa; --muted: #98a1bb; --line: #2a3050;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text); background: var(--bg);
    }
    body::before { /* soft colour glow behind the header */
      content: ''; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(600px 320px at 85% -5%, rgba(124, 77, 255, 0.20), transparent 70%),
        radial-gradient(500px 320px at -10% 0%, rgba(26, 115, 232, 0.18), transparent 70%);
    }
    main {
      max-width: 560px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 36px) 16px calc(env(safe-area-inset-bottom) + 40px);
    }

    header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; }
    .photo { /* gradient ring around the photo */
      width: 128px; height: 128px; padding: 4px; border-radius: 50%;
      background: var(--grad); box-shadow: 0 10px 30px rgba(80, 90, 230, 0.35);
    }
    .photo img {
      display: block; width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; object-position: 50% 22%; /* keeps the face centred in the portrait */
      border: 3px solid var(--bg);
    }
    h1 { margin: 18px 0 4px; font-size: 1.7rem; line-height: 1.15; }
    .tagline { margin: 0; color: var(--muted); font-size: 0.95rem; }

    .heading {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 4px 12px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    .heading span { padding: 2px 10px; border-radius: 999px; background: var(--card2); letter-spacing: 0; }

    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.project {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; min-height: 76px;
      border-radius: 20px; background: var(--card); border: 1px solid var(--line);
      box-shadow: var(--shadow); color: inherit; text-decoration: none;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    a.project:hover { transform: translateY(-2px); border-color: var(--accent); }
    a.project:active { transform: scale(0.98); }
    a.project:focus-visible { outline: 3px solid rgba(26, 115, 232, 0.55); outline-offset: 2px; }
    .icon {
      flex: none; width: 48px; height: 48px; display: grid; place-items: center;
      border-radius: 15px; background: var(--card2); font-size: 1.6rem;
    }
    .text { flex: 1; min-width: 0; }
    .title { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; }
    .desc { display: block; margin-top: 2px; color: var(--muted); font-size: 0.85rem; line-height: 1.35; }
    .badge {
      padding: 2px 8px; border-radius: 999px; background: var(--grad); color: #fff;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .arrow { flex: none; color: var(--muted); font-size: 1.3rem; transition: transform 0.15s, color 0.15s; }
    a.project:hover .arrow { transform: translateX(3px); color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="photo"><img src="photo.jpg" alt="Rajkumar"></div>
      <h1>Rajkumar</h1>
      <p class="tagline">My hobby projects</p>
    </header>

    <div class="heading">Projects <span>3</span></div>
    <!-- newest first: add new projects at the top (keep the "New" badge on the first one only) and bump the count above -->
    <ul>
      <li><a class="project" href="https://todolist-185469394031.asia-south1.run.app">
        <span class="icon" aria-hidden="true">✅</span>
        <span class="text"><span class="title">Todo List <span class="badge">New</span></span>
          <span class="desc">Todo lists per person, with an efficiency rating</span></span>
        <span class="arrow" aria-hidden="true">›</span></a></li>
      <li><a class="project" href="https://fileshare-185469394031.asia-south1.run.app">
        <span class="icon" aria-hidden="true">📁</span>
        <span class="text"><span class="title">File Share</span>
          <span class="desc">Upload a file under a word, download it anywhere with the same word</span></span>
        <span class="arrow" aria-hidden="true">›</span></a></li>
      <li><a class="project" href="https://clipboard-185469394031.asia-south1.run.app">
        <span class="icon" aria-hidden="true">📋</span>
        <span class="text"><span class="title">Online Clipboard</span>
          <span class="desc">Save text under a name and read it from any device</span></span>
        <span class="arrow" aria-hidden="true">›</span></a></li>
    </ul>
  </main>
</body>
</html>
